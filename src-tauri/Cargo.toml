[package]
name = "simulador-fisica"
version = "0.1.0"
description = "Laboratorio interactivo de electromagnetismo"
authors = ["you"]
edition = "2021"

[lib]
name = "simulador_fisica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
